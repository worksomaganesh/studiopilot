name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Prevent concurrent redundant runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Next.js production build
        run: npm run build
        env:
          # Safe, non-secret local placeholders for build-time evaluation
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          ENABLE_LOCAL_STORAGE_FALLBACK: "true"
